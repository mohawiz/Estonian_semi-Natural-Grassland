server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://archive-api.open-meteo.com; script-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown paths load the app, which routes client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
